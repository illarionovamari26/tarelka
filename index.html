<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Тарелка">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Тарелка</title>
<style>
:root {
  --bg: #F5F3EE; --card: #FFFFFF; --ink: #1B1C1A; --ink2: #6F6E67; --ink3: #A19F96; --line: #E9E5DC; --fill: #EFECE5;
  --accent: #1F8A5B; --accent-ink: #FFFFFF; --accent-soft: #E2F1E8;
  --p: #3D7DD8; --f: #E0A02B; --c: #D8623F; --over: #C8452F; --over-soft: #FBE9E5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111210; --card: #1B1D1A; --ink: #EEECE6; --ink2: #A09D93; --ink3: #6F6D66; --line: #2B2E29; --fill: #242622;
    --accent: #45C28C; --accent-ink: #0C1A12; --accent-soft: #1C3026;
    --p: #73A5F0; --f: #EDBA5A; --c: #EE8565; --over: #F2735E; --over-soft: #3A201B;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }
#app { max-width: 520px; margin: 0 auto; padding: 8px 16px 118px; padding-top: calc(env(safe-area-inset-top) + 8px); padding-bottom: calc(env(safe-area-inset-bottom) + 118px); }

/* шапка */
.top { display: flex; align-items: center; justify-content: space-between; min-height: 60px; }
.top h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 0; line-height: 1.15; }
.top .sub { font-size: 13px; color: var(--ink2); margin-top: 1px; }
.top .nav { display: flex; gap: 2px; }
.icon-btn { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: var(--ink2); }
.icon-btn:active { background: var(--fill); }
.icon-btn:disabled { opacity: .3; }

/* неделя */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 6px 0 14px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 8px; border-radius: 15px; color: var(--ink2); font-size: 12px; }
.wd b { font-size: 16px; font-weight: 600; color: var(--ink); }
.wd i { display: block; width: 18px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.wd i u { display: block; height: 100%; background: var(--accent); }
.wd.on { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.wd.today b { color: var(--accent); }
.wd.future { opacity: .35; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
.sec { font-size: 13px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: .04em; margin: 24px 4px 8px; }

/* главный блок: съедено и осталось */
.hero { display: grid; grid-template-columns: 148px 1fr; column-gap: 20px; align-items: center; }
.ring { position: relative; width: 148px; height: 148px; }
.ring svg { transform: rotate(-90deg); }
.ring .trk { stroke: var(--fill); }
.ring .bar { stroke: var(--accent); transition: stroke-dashoffset .6s cubic-bezier(.2, .8, .2, 1); }
.ring.over .bar { stroke: var(--over); }
.ring.zero .bar { opacity: 0; }
.ring .mid { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .big { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.ring.over .big { color: var(--over); }
.ring .lbl { font-size: 12px; color: var(--ink2); margin-top: 5px; }
.hs { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; }
.hs + .hs { border-top: 1px solid var(--line); }
.hs span { font-size: 14px; color: var(--ink2); }
.hs b { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.hs b small { font-size: 12px; font-weight: 400; color: var(--ink2); margin-left: 3px; }
.macros { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.mac .nm { font-size: 12px; color: var(--ink2); }
.mac .val { font-size: 16px; font-weight: 600; margin: 2px 0 7px; }
.mac .val small { font-weight: 400; color: var(--ink2); font-size: 12px; }
.bar { height: 5px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bar u { display: block; height: 100%; border-radius: 3px; }
.mac .left { font-size: 11px; color: var(--ink3); margin-top: 6px; }

/* приёмы пищи */
.meal { margin-top: 12px; padding: 6px; }
.meal-h { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 6px 12px; }
.meal-h .t { font-weight: 600; font-size: 16px; }
.meal-h .k { color: var(--ink2); font-size: 14px; }
.add { width: 36px; height: 36px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.it { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 14px; }
.it:active { background: var(--fill); }
.it .n { flex: 1; min-width: 0; }
.it .n b { display: block; font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .n span { display: block; font-size: 12.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .k { font-weight: 600; font-size: 15px; white-space: nowrap; }
.it .k small { font-weight: 400; color: var(--ink2); font-size: 11px; margin-left: 2px; }
.empty { padding: 0 12px 12px; color: var(--ink3); font-size: 14px; }
.tip { margin-top: 12px; color: var(--ink2); font-size: 14.5px; line-height: 1.45; }
.tip b { color: var(--ink); font-weight: 600; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 7px; background: var(--fill); color: var(--ink2); margin-left: 6px; font-weight: 500; vertical-align: 1px; }

/* нижняя панель */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
.tabs-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; height: 62px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; color: var(--ink3); }
.tab.on { color: var(--accent); }
.fab { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin: -24px auto 0; box-shadow: 0 8px 20px rgba(31, 138, 91, .32), 0 0 0 6px var(--bg); transition: transform .12s; }
.fab:active { transform: scale(.95); }

/* выезжающие окна */
.ov { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 12, 10, .44); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
.sheet { width: 100%; max-width: 520px; max-height: 94vh; max-height: 94dvh; background: var(--bg); border-radius: 26px 26px 0 0; display: flex; flex-direction: column; animation: up .26s cubic-bezier(.2, .9, .2, 1); }
.grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; flex: none; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 2px 20px; flex: none; }
.sheet-h h2 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.sheet-b { overflow: auto; padding: 8px 16px 18px; -webkit-overflow-scrolling: touch; }
.sheet-f { flex: none; padding: 12px 16px 14px; padding-bottom: calc(env(safe-area-inset-bottom) + 14px); border-top: 1px solid var(--line); }
@keyframes up { from { transform: translateY(36px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 54px; border-radius: 17px; font-weight: 600; font-size: 16px; background: var(--accent); color: var(--accent-ink); }
.btn:active { opacity: .88; }
.btn:disabled { background: var(--fill); color: var(--ink3); }
.btn.ghost { background: var(--fill); color: var(--ink); }
.btn.danger { background: var(--over-soft); color: var(--over); }
.btn.sm { height: 46px; border-radius: 14px; font-size: 15px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 14px; padding: 3px; gap: 2px; }
.seg button { height: 40px; border-radius: 11px; font-size: 14px; font-weight: 500; color: var(--ink2); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }

.fld { display: block; margin-top: 14px; }
.fld > span { display: block; font-size: 13px; color: var(--ink2); margin: 0 4px 6px; }
.inp { width: 100%; height: 52px; border-radius: 15px; border: 1px solid var(--line); background: var(--card); padding: 0 16px; font-size: 17px; outline: none; -webkit-appearance: none; appearance: none; }
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp::placeholder { color: var(--ink3); }
textarea.inp { height: auto; min-height: 118px; padding: 14px 66px 14px 16px; line-height: 1.4; resize: none; }
.say { position: relative; }
.mic { position: absolute; right: 10px; bottom: 10px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.mic.live { background: var(--over); color: #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(200, 69, 47, .45); } 100% { box-shadow: 0 0 0 16px rgba(200, 69, 47, 0); } }
.hint { font-size: 13px; color: var(--ink2); margin: 8px 4px 0; line-height: 1.4; }
.warn { background: var(--over-soft); color: var(--over); border-radius: 16px; padding: 12px 14px; font-size: 14px; margin-top: 10px; line-height: 1.4; }
.warn button { display: block; margin-top: 6px; font-weight: 600; text-decoration: underline; }
.list { padding: 6px; margin-top: 12px; }

.step { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; }
.step button { height: 52px; border-radius: 15px; background: var(--fill); font-size: 24px; line-height: 1; }
.step .inp { text-align: center; font-weight: 600; font-size: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { padding: 9px 13px; border-radius: 12px; background: var(--fill); font-size: 14px; }
.chip.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.sum4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.sum4 div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 4px; text-align: center; }
.sum4 b { display: block; font-size: 18px; font-weight: 700; }
.sum4 span { font-size: 11px; color: var(--ink2); }
.ed-name { font-size: 18px; font-weight: 600; line-height: 1.25; margin: 2px 4px 0; }

.opt { display: block; width: 100%; text-align: left; padding: 13px 15px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); margin-top: 8px; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt b { display: block; font-size: 15px; font-weight: 600; }
.opt span { font-size: 13px; color: var(--ink2); }
.line { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.sw { width: 52px; height: 32px; border-radius: 16px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.sw.on { background: var(--accent); }
.sw.on::after { left: 23px; }
.norm-k { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.norm-k small { font-size: 15px; font-weight: 400; color: var(--ink2); letter-spacing: 0; margin-left: 4px; }
.kv { display: flex; justify-content: space-between; padding: 9px 0; font-size: 14.5px; border-top: 1px solid var(--line); }
.kv span { color: var(--ink2); }
.note { font-size: 13px; color: var(--ink2); line-height: 1.45; margin: 10px 2px 0; }
.note b { color: var(--ink); font-weight: 600; }

/* графики */
.chart { width: 100%; height: auto; margin-top: 10px; }
.chart .ax { fill: var(--ink3); font-size: 10px; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ln { stroke: var(--accent); fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--accent); opacity: .1; }
.chart .dot { fill: var(--card); stroke: var(--accent); stroke-width: 2; }
.chart .goal { stroke: var(--ink3); stroke-dasharray: 4 4; stroke-width: 1.2; }
.chart .bk { fill: var(--accent); }
.chart .bk.ov2 { fill: var(--over); }
.chart .bk.none { fill: var(--fill); }
.big-w { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.big-w small { font-size: 15px; font-weight: 400; color: var(--ink2); letter-spacing: 0; margin-left: 4px; }
.delta { display: inline-block; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 9px; background: var(--fill); color: var(--ink2); margin: 10px 6px 0 0; }
.delta.dn { background: var(--accent-soft); color: var(--accent); }
.delta.up { background: var(--over-soft); color: var(--over); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 104px; bottom: calc(env(safe-area-inset-bottom) + 104px); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 15px; font-size: 14px; display: flex; gap: 16px; align-items: center; z-index: 30; max-width: 92vw; animation: up .2s; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
.toast button { font-weight: 700; color: var(--bg); text-decoration: underline; white-space: nowrap; }
.ver { text-align: center; font-size: 12px; color: var(--ink3); margin-top: 22px; }

</style>
</head>

    },
    'man-toggle': function () {
      pfRead();
      if (!S.manual.on) { var c = calcNorm(S.profile); if (c) S.manual = { on: true, kcal: c.kcal, p: c.p, f: c.f, c: c.c }; else S.manual.on = true; } else S.manual.on = false;
      save(); var y = window.pageYOffset; render(); window.scrollTo(0, y);
    },

    'bk-out': function () {
      sheet('Копия данных', '<div class="note" style="margin-top:0">Скопируйте текст и сохраните его в заметках или отправьте себе в мессенджер. На новом телефоне вставьте его в «Восстановить».</div><textarea id="bk-text" class="inp" style="margin-top:12px;padding:14px 16px;min-height:160px;font-size:13px" readonly>' + esc(backupText()) + '</textarea>',
        '<button class="btn" data-act="bk-copy">Скопировать</button>');
    },
    'bk-copy': function () {
      var ta = $('#bk-text'), done = function () { toast('Скопировано'); };
      ta.focus(); ta.select();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) { toast('Выделите текст и скопируйте вручную'); } });
      else { try { document.execCommand('copy'); done(); } catch (e) { toast('Выделите текст и скопируйте вручную'); } }
    },
    'bk-in': function () {
      sheet('Восстановить данные', '<div class="note" style="margin-top:0">Вставьте сюда сохранённую копию. Текущие записи на этом телефоне будут заменены.</div><textarea id="bk-text" class="inp" style="margin-top:12px;padding:14px 16px;min-height:160px;font-size:13px" placeholder="Вставьте текст копии"></textarea>',
        '<button class="btn" data-act="bk-load">Заменить данные копией</button>');
    },
    'bk-load': function () {
      var s = null;
      try { s = JSON.parse($('#bk-text').value); } catch (e) { }
      if (!s || typeof s.days !== 'object') { toast('Это не похоже на копию данных приложения'); return; }
      var old = S; S = fill(s); rebuild(); save(); pf = null; closeSheet(); ui.tab = 'day'; ui.date = today(); render();
      toast('Данные восстановлены', 'Отменить', function () { S = old; rebuild(); save(); render(); });
    }
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el) return;
    var a = el.getAttribute('data-act');
    if (a === 'close-ov' && ev.target !== el) return;
    if (ACT[a]) ACT[a](el);
  });
  document.addEventListener('input', function (ev) {
    var id = ev.target.id;
    if (id === 'say-text') updateSay();
    else if (id === 'ed-g') { ed.g = numIn(ev.target.value); edSum(); }
    else if (id === 'pick-q') pickUpdate();
    else if (id === 'food-q') { ui.q = ev.target.value; foodsUpdate(); }
    else if (id.indexOf('man-') === 0) { var x = numIn(ev.target.value); if (x >= 0) { S.manual[id.slice(4)] = x; save(); } }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && sheetOpen) closeSheet(); });

  // мост для Android-оболочки
  window.App = {
    onSpeech: function (t) { setMic(false); if (t) setText(joinText(draft.text, t)); },
    onSpeechError: function () { noSpeech(); },
    onBack: function () { if (sheetOpen) { closeSheet(); return true; } if (ui.tab !== 'day') { ui.tab = 'day'; render(); return true; } return false; }
  };

  rebuild();
  if (ui.tab === 'me') pfInit();
  render();
  // для автопроверки и снимков экрана: #t=вкладка, #say=текст
  var hs = decodeURIComponent(location.hash || ''), ht = /[#&]t=(\w+)/.exec(hs), hsay = /[#&]say=([^&]*)/.exec(hs);
  if (ht && VIEWS[ht[1]]) { ui.tab = ht[1]; if (ui.tab === 'me') pfInit(); render(); }
  if (hsay) { draft = { text: hsay[1], meal: 'b', res: null }; openSay(); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () { });
})();

</script>
</body>
</html>
